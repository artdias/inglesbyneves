<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&amp;display=swap');
      .font-serif { font-family: 'Playfair Display', serif; }
    </style>
  </defs>
  
  <!-- Outer Arcs -->
  <path d="M 280 60 A 220 220 0 0 1 470 260" fill="none" stroke="#F2D5CE" stroke-width="4" stroke-linecap="round"/>
  <path d="M 100 420 A 230 230 0 0 0 350 490" fill="none" stroke="#ECDED5" stroke-width="4" stroke-linecap="round"/>

  <!-- Flagpole -->
  <line x1="140" y1="60" x2="140" y2="180" stroke="#F2D5CE" stroke-width="6" stroke-linecap="round"/>
  <circle cx="140" cy="50" r="8" fill="none" stroke="#F2D5CE" stroke-width="4"/>
  <line x1="130" y1="60" x2="150" y2="60" stroke="#F2D5CE" stroke-width="4"/>

  <!-- Flag -->
  <g transform="translate(140, 70)">
    <path d="M 5 0 Q 80 -15 150 10 T 230 -10 L 230 90 Q 150 110 80 85 T 5 100 Z" fill="none" stroke="#F2D5CE" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 5 45 Q 80 30 230 40" fill="none" stroke="#F2D5CE" stroke-width="4"/>
    <path d="M 120 0 L 120 90" fill="none" stroke="#F2D5CE" stroke-width="4"/>
    <path d="M 5 0 L 230 90" fill="none" stroke="#F2D5CE" stroke-width="3"/>
    <path d="M 5 100 L 230 -10" fill="none" stroke="#F2D5CE" stroke-width="3"/>
  </g>

  <!-- Letters -->
  <text x="80" y="380" class="font-serif" font-size="300" fill="#ECDED5">E</text>
  <text x="250" y="420" class="font-serif" font-size="280" fill="#F2D5CE">N</text>

  <!-- Cursive Swoosh -->
  <path d="M 130 330 C -20 280, -20 440, 90 420 C 190 400, 240 450, 310 410" fill="none" stroke="#F2D5CE" stroke-width="4" stroke-linecap="round"/>
</svg>
